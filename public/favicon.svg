<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base container squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- High-Tech Monogram: E + L with glowing node -->
  <g filter="url(#glow)">
    <!-- Vertical Spine (E & L shared backbone) -->
    <rect x="15" y="15" width="7" height="34" rx="3.5" fill="url(#neonGlow)"/>

    <!-- Top bar of E -->
    <rect x="21" y="15" width="23" height="7" rx="3.5" fill="url(#neonGlow)"/>

    <!-- Middle bar of E -->
    <rect x="21" y="28.5" width="16" height="7" rx="3.5" fill="url(#neonGlow)"/>

    <!-- Bottom bar of L (extended base) -->
    <rect x="21" y="42" width="28" height="7" rx="3.5" fill="url(#neonGlow)"/>

    <!-- Cyber accent node (AI indicator beacon) -->
    <circle cx="48" cy="18.5" r="3.5" fill="#34d399"/>
  </g>
</svg>